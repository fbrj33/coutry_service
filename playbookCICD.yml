- name: Build and Deploy Docker Image to Kubernetes
  hosts: localhost
  connection: local

  vars_files:
    - vault.yml

  vars:
    image_name: my-country-service
    image_tag: latest
    dockerfile_path: "{{ playbook_dir }}"
    kube_config: "{{ kubeconfig_path | default(playbook_dir + '/config') }}"

  tasks:
    - name: Log in to Docker Hub
      community.docker.docker_login:
        username: "{{ dockerhub_username }}"
        password: "{{ dockerhub_password }}"
        reauthorize: true

    - name: Build Docker image
      community.docker.docker_image:
        name: "{{ dockerhub_username }}/{{ image_name }}"
        tag: "{{ image_tag }}"
        source: build
        build:
          path: "{{ dockerfile_path }}"

    - name: Push Docker image to Docker Hub
      community.docker.docker_image:
        name: "{{ dockerhub_username }}/{{ image_name }}"
        tag: "{{ image_tag }}"
        push: true
        source: local

    - name: Apply Kubernetes Deployment (and wait until pods are ready)
      kubernetes.core.k8s:
        state: present
        namespace: jenkins
        kubeconfig: "{{ kube_config }}"
        definition: "{{ lookup('template', playbook_dir + '/deployment.yaml') | from_yaml }}"
        wait: true
        wait_timeout: 180

    - name: Apply Kubernetes Service
      kubernetes.core.k8s:
        state: present
        namespace: jenkins
        kubeconfig: "{{ kube_config }}"
        src: "{{ playbook_dir }}/service.yaml"
